[package]
name = "ha_iroh_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
ha_iroh_proto = { path = "../proto" }
# no portmapper/metrics on Android; bridge keeps iroh defaults
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
uniffi = "0.32"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "time"] }
thiserror = "2"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
ha_iroh_bridge = { path = "../bridge" }
tokio = { version = "1", features = ["macros", "net", "fs"] }
clap = { version = "4", features = ["derive"] }
