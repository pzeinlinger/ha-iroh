[package]
name = "ha_iroh_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
ha_iroh_proto = { path = "../proto" }
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
