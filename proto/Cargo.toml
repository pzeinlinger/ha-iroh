[package]
name = "ha_iroh_proto"
version = "0.1.0"
edition = "2021"

[dependencies]
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
anyhow = "1"
tokio = { version = "1", features = ["io-util"] }
