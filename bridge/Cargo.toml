[package]
name = "ha_iroh_bridge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ha-iroh-bridge"
path = "src/main.rs"

[dependencies]
ha_iroh_proto = { path = "../proto" }
iroh = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "fs", "sync", "time", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
